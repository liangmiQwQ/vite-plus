name: Build CLI test binaries

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VP_NODE_DIST_MIRROR: ${{ vars.VP_NODE_DIST_MIRROR || 'https://nodejs.org/dist' }}

jobs:
  build:
    name: Build CLI test binaries (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    # Hosted M1 cold builds are slower than the upstream Namespace runners.
    timeout-minutes: 40
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: cli-snapshot-test-${{ inputs.target }}-ci

      - uses: ./.github/actions/setup-ci-node

      - name: Build with upstream
        uses: ./.github/actions/build-upstream
        with:
          profile: ci
          target: ${{ inputs.target }}

      - name: Ensure no unexpected file changes after build
        if: ${{ inputs.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected file changes detected after build"
            git status
            git diff
            exit 1
          fi

      - name: Verify incremental CLI build
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        run: |
          # The Rust CLI embeds this manifest; a no-op JS build must not touch it.
          manifest_mtime=$(stat -c '%y' packages/cli/package.json)
          pnpm --filter vite-plus build-ts
          test "$manifest_mtime" = "$(stat -c '%y' packages/cli/package.json)"

      - name: Build snapshot test binaries
        run: cargo test -p vp_cli_snapshots --no-run --message-format=json > "$RUNNER_TEMP/snapshot-test-build.json"

      - name: Test snapshot runner utilities
        run: cargo test -p vp_cli_snapshots --test redact_unit --test shard_unit --test registry_pack_unit --test report_unit --test schedule_unit

      - name: Package CLI test binaries
        run: |
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          binding_dir="$artifact_dir/packages/cli/binding"
          cli_dir="$artifact_dir/target/$BUILD_TARGET/release"
          snapshot_dir="$artifact_dir/target/snapshot-tests"
          mkdir -p "$binding_dir" "$cli_dir" "$snapshot_dir"

          cp packages/cli/binding/*.node packages/cli/binding/vite-plus.build-time "$binding_dir/"
          cargo metadata --locked --format-version 1 \
            | jq '{packages: [.packages[] | {name, version, source}]}' \
            > "$binding_dir/vite-plus.cargo-metadata.json"
          cp "${CARGO_TARGET_DIR:-target}/$BUILD_TARGET/release/vp" "$cli_dir/"
          for binary in cli_snapshots vpt; do
            binary_path="$(jq -er --arg name "$binary" \
              'select(.reason == "compiler-artifact" and .target.name == $name and .executable != null) | .executable' \
              "$RUNNER_TEMP/snapshot-test-build.json")"
            cp "$binary_path" "$snapshot_dir/$binary"
          done
          tar -czf "$RUNNER_TEMP/cli-test-binaries.tar.gz" -C "$artifact_dir" .
        env:
          BUILD_TARGET: ${{ inputs.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-test-binaries-${{ inputs.target }}
          path: ${{ runner.temp }}/cli-test-binaries.tar.gz
          if-no-files-found: error
          retention-days: 7
