name: CLI snapshot tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VP_NODE_DIST_MIRROR: ${{ vars.VP_NODE_DIST_MIRROR || 'https://nodejs.org/dist' }}

jobs:
  test:
    name: CLI snapshot tests (${{ inputs.target }}, shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      # Fish and Zsh can both use apt or Homebrew; keep their installs sequential.
      - name: Install snapshot shells
        id: snapshot-shells
        background: true
        run: |
          for snapshot_shell in fish zsh; do
            if ! command -v "$snapshot_shell" >/dev/null 2>&1; then
              if [ "$RUNNER_OS" = 'Linux' ]; then
                sudo apt-get update
                sudo apt-get install --yes "$snapshot_shell"
              else
                brew install "$snapshot_shell"
              fi
            fi
            "$snapshot_shell" --version
          done

      # Includes release lookup retries: https://github.com/hustcer/setup-nu/pull/225.
      - name: Install Nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          # renovate: datasource=github-releases depName=nushell/nushell
          version: '0.116.1'

      - uses: ./.github/actions/setup-ci-node

      - uses: ./.github/actions/download-cli-test-binaries
        with:
          target: ${{ inputs.target }}

      - name: Install Playwright Chromium
        id: playwright
        background: true
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Build with upstream
        uses: ./.github/actions/build-upstream
        with:
          target: ${{ inputs.target }}
          skip-native: true

      - name: Install Global CLI vp
        run: pnpm bootstrap-cli:ci

      # Seed the repository pin, aliases, and shared fixture selectors before
      # command timers start. Keep the version list shared across platforms.
      - name: Prewarm managed runtimes
        run: bash .github/scripts/prewarm-node.sh "$HOME/.vite-plus/bin/vp"
        env:
          VP_LOG: vp_js_runtime=info

      - wait: [snapshot-shells, playwright]

      - name: Run PTY snapshot tests
        run: |
          export VP_SNAP_SH_BIN="$(command -v sh)"
          export VP_SNAP_BASH_BIN="$(command -v bash)"
          export VP_SNAP_ZSH_BIN="$(command -v zsh)"
          VP_SNAP_GLOBAL_VP="$HOME/.vite-plus/bin/vp" \
          VP_SNAP_JS_RUNTIME_DIR="$HOME/.vite-plus/js_runtime" \
          VP_SNAP_FISH_BIN="$(command -v fish)" \
          VP_SNAP_NU_BIN="$(command -v nu)" \
          ./target/snapshot-tests/cli_snapshots --test-threads 8
        env:
          RUST_BACKTRACE: '1'
          # Relocate fixture and helper paths while keeping the same test
          # process and VP_SNAP_SHARD partitioning as cargo test.
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/vp_cli_snapshots
          CARGO_BIN_EXE_vpt: ${{ github.workspace }}/target/snapshot-tests/vpt
          VP_SNAP_SHARD: ${{ matrix.shard }}/3
          VP_SNAP_ARTIFACTS_DIR: ${{ runner.temp }}/snapshot-artifacts

      - name: Upload snapshot diagnostics and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diagnostics-${{ inputs.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7
